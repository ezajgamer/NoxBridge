# يبني NoxBridge من الكود هني بس (بدون ملفات اللعبة): البرنامج، والمرقّع، وNoxGame.dll،
# ويرفع الحزمة كـartifact. خطوة التوقيع (SignPath) تنضاف هني بعد قبول المشروع.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt pyinstaller

      - name: Icon
        # البرنامج يرسم أيقونته (nox.ico) أول ما يشتغل — نرسمها هني بدون نافذة
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/make_icon.py

      - name: Build
        shell: powershell
        run: |
          ./tools/build-release.ps1 -Version ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}

      - uses: actions/upload-artifact@v4
        with:
          name: NoxBridge
          path: release/NoxBridge-*.zip
